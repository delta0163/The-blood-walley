
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>The Valley of Blood</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <header class="topbar">
      <div class="logo">THE VALLEY OF BLOOD</div>
      <div id="clock">12 AM</div>
    </header>

    <section id="office" class="office front">
      <div class="darkness"></div>

      <div class="wall">
        <div class="wall-light"></div>
        <div class="wall-mark"></div>
      </div>

      <div id="leftPassage" class="passage left-passage">
        <div class="passage-frame"></div>
        <div class="passage-floor"></div>
        <div id="leftEnemy" class="enemy">?</div>
        <div class="passage-label">ЛЕВЫЙ ПРОХОД</div>
      </div>

      <div id="rightPassage" class="passage right-passage">
        <div class="passage-frame"></div>
        <div class="passage-floor"></div>
        <div id="rightEnemy" class="enemy">?</div>
        <div class="passage-label">ПРАВЫЙ ПРОХОД</div>
      </div>

      <div id="backRoom" class="back-room">
        <div class="stove">
          <div class="stove-pipe"></div>
          <div class="stove-body">
            <div class="stove-door">
              <div id="fire" class="fire"></div>
            </div>
          </div>
        </div>
        <div class="back-label">ПЕЧКА</div>
      </div>

      <div class="desk">
        <div class="desk-top">
          <button id="flashlightItem" class="item flashlight-item">
            <span class="flashlight-icon">🔦</span>
            <span>Фонарик</span>
          </button>

          <button id="woodItem" class="item wood-item">
            <span class="wood-icon">🪵</span>
            <span>Дрова</span>
          </button>

          <div class="paper">ЖУРНАЛ<br>СМЕНЫ</div>
          <div class="mug">☕</div>
        </div>
        <div class="desk-front"></div>
      </div>

      <div id="flashBeam" class="flash-beam"></div>
      <div id="notice" class="notice">Смена началась...</div>
      <div id="message" class="message"></div>
    </section>

    <section class="controls">
      <div class="turn-controls">
        <button id="turnLeft" class="control-button">
          ◀ ВЛЕВО
        </button>
        <button id="turnFront" class="control-button">
          ПРЯМО
        </button>
        <button id="turnRight" class="control-button">
          ВПРАВО ▶
        </button>
      </div>

      <div class="action-controls">
        <button id="useFlashlight" class="action-button" disabled>
          🔦 СВЕТИТЬ
        </button>
        <button id="putWood" class="action-button" disabled>
          🪵 ПОЛОЖИТЬ ДРОВА
        </button>
        <button id="turnBack" class="action-button">
          🔥 К ПЕЧКЕ
        </button>
      </div>

      <div class="status">
        <div>Фонарик: <span id="flashStatus">на столе</span></div>
        <div>Дрова: <span id="woodStatus">на столе</span></div>
        <div>Огонь: <span id="fireStatus">горит</span></div>
      </div>
    </section>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h1 id="overlayTitle">КОНЕЦ СМЕНЫ</h1>
        <p id="overlayText"></p>
        <button id="restart">ЗАНОВО</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
